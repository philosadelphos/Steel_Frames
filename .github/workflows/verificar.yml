name: Verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Propriedades contra valores de catálogo
        run: node testes/verificar.js
      - name: Ações e madres
        run: node testes/madres.js
      - name: Madres enformadas a frio e dados O Feliz
        run: node testes/enformados.js
      - name: index.html gerado a partir de src/
        run: node ferramentas/construir.js --verificar
